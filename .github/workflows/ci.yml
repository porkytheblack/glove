name: CI

# Gates typecheck + unit tests so a broken `tsc` or a failing suite can't land
# unnoticed. The only other workflow, glovebox-images.yml, runs on `push` to
# main under docker/** and never on pull requests.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repl:
    name: typecheck + test (core + scratchpad + REPLs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is pinned by the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packages resolve their workspace deps through built dist/ (package
      # `exports`), so those must be built before anything downstream can
      # typecheck or run its tsx-loaded tests. The `...` suffix pulls each
      # target's own workspace deps in topological order: scratchpad brings
      # glove-core/glove-sql/glove-mcp for the REPLs, and the env-* stdlib
      # adapters bring glove-working-environment (they import both its root
      # entry and its ./testing subpath).
      - name: Build shared deps
        run: >-
          pnpm
          --filter "glove-voice-livekit..."
          --filter "glove-scratchpad..."
          --filter "glove-env-documents..."
          --filter "glove-env-spreadsheets..."
          --filter "glove-env-images..."
          --filter "glove-env-zip..."
          --filter "glove-env-media..."
          --filter "glove-env-slides..."
          --filter "glove-env-render..."
          --filter "glove-env-ocr..."
          --filter "glove-env-email..."
          --filter "glove-env-motion..."
          --filter "glove-image..."
          --filter "glove-analyst-desk..."
          build

      # glovebox-core and glovebox-kit each declare the other as a dependency:
      # the `glovebox build` CLI resolves and bundles the in-container runtime,
      # and that runtime imports the wire protocol's types. pnpm reports the
      # cycle ("There are cyclic workspace dependencies") and, having no
      # topological order to follow, runs both `tsup` processes at once. Their
      # dts builds then race, and glovebox-kit loses about as often as it wins:
      #   error TS7016: Could not find a declaration file for module
      #                 'glovebox-core/protocol'
      # Only one direction of the cycle is real at build time — nothing in
      # glovebox-core's source imports the kit, so it compiles with no kit
      # dist at all. So the order is forced by hand. It has to be two separate
      # invocations rather than one pre-build pass, because `clean: true` in
      # both tsup configs means a second pass over glovebox-core would delete
      # the .d.ts the kit is mid-read of.
      - name: Build glovebox (cyclic — ordered by hand)
        run: |
          pnpm --filter glovebox-core build
          pnpm --filter glovebox-kit --filter glovebox-client build

      # Scoped to the packages this workstream develops. A repo-wide gate would
      # first need the full build graph to be green (e.g. glove-react consumes
      # glove-voice's built .d.ts), which is a separate concern.
      - name: Typecheck
        run: >-
          pnpm
          --filter glove-core
          --filter glove-voice-s2s
          --filter glove-voice-avatar
          --filter glove-voice-livekit
          --filter glove-memory
          --filter glove-scratchpad
          --filter glove-egress
          --filter glove-python
          --filter glove-js
          --filter glove-lisp
          --filter glove-vfs
          --filter glove-working-environment
          --filter glove-env-documents
          --filter glove-env-spreadsheets
          --filter glove-env-images
          --filter glove-env-zip
          --filter glove-env-media
          --filter glove-env-slides
          --filter glovebox-core
          --filter glovebox-kit
          --filter glovebox-client
          --filter glove-env-render
          --filter glove-env-ocr
          --filter glove-env-email
          --filter glove-env-motion
          --filter glove-image
          --filter glove-analyst-desk
          --filter glove-document-desk
          --filter glovebox-env-example
          typecheck

      # env:motion renders in a real browser. Without this step its render
      # tests skip with a message rather than passing quietly — which means a
      # green CI would say nothing about the part of that package that matters.
      - name: Install Chromium for env:motion
        run: pnpm --filter glove-env-motion exec playwright-core install --with-deps chromium

      - name: Test
        run: >-
          pnpm
          --filter glove-voice-s2s
          --filter glove-voice-avatar
          --filter glove-voice-livekit
          --filter glove-memory
          --filter glove-scratchpad
          --filter glove-egress
          --filter glove-python
          --filter glove-js
          --filter glove-lisp
          --filter glove-vfs
          --filter glove-working-environment
          --filter glove-env-documents
          --filter glove-env-spreadsheets
          --filter glove-env-images
          --filter glove-env-zip
          --filter glove-env-media
          --filter glove-env-slides
          --filter glove-env-render
          --filter glove-env-ocr
          --filter glove-env-email
          --filter glove-env-motion
          --filter glove-image
          test

      # The analyst-desk selfcheck solves every eval scenario with a reference
      # script and runs the real graders over the result. No API key, no cost,
      # ~11s — and it is the only thing that exercises documents, spreadsheets,
      # images and slides together against the environment, which is where the
      # interesting breakage lives. It caught three harness bugs on its first
      # run; left ungated it would rot silently.
      - name: Integration — analyst-desk selfcheck
        run: pnpm --filter glove-analyst-desk selfcheck
