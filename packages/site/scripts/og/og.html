<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080B0A; --accent:#9ED4B8; --accent-strong:#BEE7D0; --accent-soft:#7BBFA0;
    --text:#EAF2ED; --muted:#8FA398; --line:rgba(158,212,184,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--bg);font-family:'DM Sans',sans-serif;position:relative}

  /* arcade playfield grid */
  .grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(158,212,184,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(158,212,184,.055) 1px, transparent 1px);
    background-size:30px 30px;
    -webkit-mask-image:radial-gradient(115% 95% at 32% 50%, #000 20%, transparent 78%);
            mask-image:radial-gradient(115% 95% at 32% 50%, #000 20%, transparent 78%);
  }
  /* phosphor bloom behind the catch */
  .bloom{position:absolute;left:360px;top:312px;width:700px;height:700px;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(158,212,184,.15) 0%, rgba(158,212,184,.05) 34%, transparent 66%);}

  svg.scene{position:absolute;inset:0;width:1200px;height:630px}

  .glove{position:absolute;left:360px;top:312px;width:258px;height:258px;transform:translate(-50%,-50%);
    color:var(--accent-strong);
    filter:drop-shadow(0 0 18px rgba(158,212,184,.55)) drop-shadow(0 0 46px rgba(158,212,184,.28));}
  .glove svg{width:100%;height:100%;display:block}

  .type{position:absolute;z-index:5;left:648px;top:50%;transform:translateY(-50%);width:492px}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent-soft);display:flex;align-items:center;gap:11px;margin-bottom:20px}
  .kicker::before{content:'';width:26px;height:1px;background:var(--line)}
  h1{font-size:104px;font-weight:500;letter-spacing:-.035em;line-height:.92;color:var(--text)}
  .rule{width:62px;height:2px;background:var(--accent);margin:22px 0 20px;
    box-shadow:0 0 12px rgba(158,212,184,.6)}
  p{font-size:29px;font-weight:300;line-height:1.34;color:var(--muted);letter-spacing:-.011em}
  p b{color:var(--accent-strong);font-weight:400}
  .foot{position:absolute;z-index:5;left:648px;bottom:58px;display:flex;gap:9px;align-items:center;
    font-family:'JetBrains Mono',monospace;font-size:14.5px;color:#5E6F66;letter-spacing:.02em}
  .foot i{width:3px;height:3px;border-radius:50%;background:#3A4C43;font-style:normal}

  /* arcade corner brackets */
  .brk{position:absolute;width:24px;height:24px;border:1.5px solid rgba(158,212,184,.22)}
  .tl{top:34px;left:34px;border-right:0;border-bottom:0}
  .tr{top:34px;right:34px;border-left:0;border-bottom:0}
  .bl{bottom:34px;left:34px;border-right:0;border-top:0}
  .br{bottom:34px;right:34px;border-left:0;border-top:0}

  /* CRT scanlines */
  .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.30) 2px 4px);
    opacity:.34;mix-blend-mode:multiply;z-index:3}
  .vig{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(125% 105% at 50% 45%, transparent 52%, rgba(0,0,0,.62) 100%)}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="bloom"></div>

  <svg class="scene" id="scene" viewBox="0 0 1200 630">
    <defs>
      <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#9ED4B8" stop-opacity="0"/>
        <stop offset="55%"  stop-color="#9ED4B8" stop-opacity=".30"/>
        <stop offset="100%" stop-color="#BEE7D0" stop-opacity=".62"/>
      </linearGradient>
    </defs>
    <g id="paths" fill="none" stroke="url(#trail)" stroke-width="1.5" stroke-dasharray="3 7" stroke-linecap="round">
      <path d="M -20 84  Q 190 108 348 250"/>
      <path d="M -20 208 Q 168 222 330 286"/>
      <path d="M -20 348 Q 170 380 332 344"/>
      <path d="M -20 486 Q 182 486 348 378"/>
      <path d="M -20 590 Q 222 578 366 408"/>
    </g>
    <g id="rings" fill="none" stroke="#9ED4B8">
      <circle cx="360" cy="312" r="152" stroke-opacity=".13" stroke-width="1"/>
      <circle cx="360" cy="312" r="196" stroke-opacity=".07" stroke-width="1" stroke-dasharray="2 10"/>
    </g>
    <g id="pix"></g>
  </svg>

  <div class="glove">
    <svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path id="hand" fill="currentColor"/>
      <path id="cuff" fill="currentColor"/>
    </svg>
  </div>

  <div class="type">
    <h1>Glove</h1>
    <div class="rule"></div>
    <p>Build agents that do <b>cool things</b>.</p>
  </div>

  <div class="foot">MIT <i></i> v3</div>

  <div class="brk tl"></div><div class="brk tr"></div>
  <div class="brk bl"></div><div class="brk br"></div>
  <div class="scan"></div>
  <div class="vig"></div>

<script>

  // Pixel projectiles sampled along each trajectory — squares grow and
  // brighten as they approach the catch, so the eye reads motion inward.
  const pix = document.getElementById('pix');
  document.querySelectorAll('#paths path').forEach((p) => {
    const L = p.getTotalLength();
    const N = 9;
    for (let i = 0; i < N; i++) {
      const t = 0.14 + (i / (N - 1)) * 0.82;      // skip the very start
      const pt = p.getPointAtLength(L * t);
      const size = 2.6 + t * 6.6;                  // 2.2px → 7.8px
      const op = 0.10 + Math.pow(t, 1.7) * 0.78;
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', pt.x - size / 2);
      r.setAttribute('y', pt.y - size / 2);
      r.setAttribute('width', size);
      r.setAttribute('height', size);
      r.setAttribute('fill', t > 0.72 ? '#BEE7D0' : '#9ED4B8');
      r.setAttribute('opacity', op.toFixed(3));
      pix.appendChild(r);
    }
  });
  window.__ready = true;
</script>
</body>
</html>
