<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">One Foundry-managed Station</title><desc id="desc">The console connects to Foundry, which owns one Station daemon. That daemon runs agent jobs and hosts optional browser and sandbox resource adapters connected to Steel and Docker.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#0b6d70" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="530" rx="18" fill="#edf4fa"/>
<g font-family="Arial,sans-serif" fill="#142a42">
<text x="40" y="45" font-size="14" letter-spacing="2">ONE STATION · JOBS AND OPTIONAL RESOURCES</text>
<g fill="#fff" stroke="#cad9e6"><rect x="40" y="100" width="240" height="105" rx="10"/><rect x="40" y="275" width="240" height="125" rx="10"/><rect x="355" y="85" width="440" height="365" rx="14" fill="#f8fbff"/><rect x="385" y="155" width="380" height="105" rx="10"/><rect x="385" y="305" width="380" height="105" rx="10"/><rect x="875" y="220" width="285" height="95" rx="10"/><rect x="875" y="365" width="285" height="95" rx="10"/></g>
<text x="60" y="135" font-size="20">Local console</text><text x="60" y="166" font-size="14" fill="#65788a">Directions · browser · preview</text>
<text x="60" y="312" font-size="20">Foundry runtime</text><text x="60" y="343" font-size="14" fill="#65788a">Starts and stops its Station</text><text x="60" y="372" font-size="14" fill="#65788a">Instances · conversations · traces</text>
<text x="385" y="125" font-size="21">Managed Station daemon</text>
<text x="405" y="192" font-size="20">Agent job processes</text><text x="405" y="225" font-size="14" fill="#0b6d70">mountBrowser · mountSandbox</text>
<text x="405" y="340" font-size="20">Optional resource adapters</text><text x="405" y="372" font-size="14" fill="#65788a">Authenticated API · scoped grants</text>
<text x="895" y="254" font-size="20">Steel browser</text><text x="895" y="284" font-size="14" fill="#65788a">Proxied pages + sign-in profile</text>
<text x="895" y="399" font-size="20">Docker sandbox</text><text x="895" y="429" font-size="14" fill="#65788a">Files + commands + servers</text>
<text x="40" y="493" font-size="15" fill="#65788a">Application chooses providers. Foundry owns the daemon. Agents receive capabilities through mounts.</text>
</g><g fill="none" stroke="#0b6d70" stroke-width="2" marker-end="url(#arrow)"><path d="M160 205V265"/><path d="M280 332H345"/><path d="M575 260V295"/><path d="M765 350H830V267H865"/><path d="M765 370H830V412H865"/></g></svg>
