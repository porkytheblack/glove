<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">Five places a classifier judges data before an agent reads it</title>
<desc id="d">Agent tools, REPLs, working environments, browsers and Foundry transmissions each keep the data where it is, send it to a classifier, and pass only answers on to the agent.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#0b6d70" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="660" rx="18" fill="#edf4fa"/>
<g font-family="Arial,sans-serif" fill="#142a42">
<text x="40" y="44" font-size="14" letter-spacing="2">USAGE PATTERNS · THE DATA STAYS PUT, THE ANSWER MOVES</text>
<g font-size="13" fill="#65788a" letter-spacing="1"><text x="64" y="92">SURFACE</text><text x="316" y="92">WHERE THE DATA LIVES</text><text x="580" y="92">THE CLASSIFIER CALL</text><text x="948" y="92">WHAT REACHES THE AGENT</text></g>
<rect x="40" y="110" width="1120" height="88" rx="12" fill="#fff" stroke="#cad9e6"/>
<text x="64" y="148" font-size="19">Agent tools</text>
<text x="64" y="174" font-size="12" font-family="Menlo,monospace" fill="#65788a">mountClassifier()</text>
<rect x="306" y="128" width="236" height="52" rx="8" fill="#f4f7fa" stroke="#cad9e6"/>
<text x="424" y="159" font-size="13.5" text-anchor="middle">A host source: inbox, queue, crawl</text>
<path d="M546 154H566" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="128" width="350" height="52" rx="8" fill="#e7f5f1" stroke="#0b6d70"/>
<text x="745" y="159" font-size="12.5" text-anchor="middle" font-family="Menlo,monospace" fill="#0b6d70">glove_classify_source</text>
<path d="M924 154H940" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="944" y="128" width="196" height="52" rx="8" fill="#fff" stroke="#142a42" stroke-width="1.5"/>
<text x="1042" y="159" font-size="13" text-anchor="middle">ids · labels · answers</text>
<rect x="40" y="214" width="1120" height="88" rx="12" fill="#fff" stroke="#cad9e6"/>
<text x="64" y="252" font-size="19">REPLs</text>
<text x="64" y="278" font-size="12" font-family="Menlo,monospace" fill="#65788a">classifierFns() · js / py / lisp</text>
<rect x="306" y="232" width="236" height="52" rx="8" fill="#f4f7fa" stroke="#cad9e6"/>
<text x="424" y="263" font-size="13.5" text-anchor="middle">Records a program pulled</text>
<path d="M546 258H566" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="232" width="350" height="52" rx="8" fill="#e7f5f1" stroke="#0b6d70"/>
<text x="745" y="263" font-size="12.5" text-anchor="middle" font-family="Menlo,monospace" fill="#0b6d70">classifier.many({ items, questions })</text>
<path d="M924 258H940" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="944" y="232" width="196" height="52" rx="8" fill="#fff" stroke="#142a42" stroke-width="1.5"/>
<text x="1042" y="263" font-size="13" text-anchor="middle">the program's return value</text>
<rect x="40" y="318" width="1120" height="88" rx="12" fill="#fff" stroke="#cad9e6"/>
<text x="64" y="356" font-size="19">Working environment</text>
<text x="64" y="382" font-size="12" font-family="Menlo,monospace" fill="#65788a">classifierEnv() · env:classifier</text>
<rect x="306" y="336" width="236" height="52" rx="8" fill="#f4f7fa" stroke="#cad9e6"/>
<text x="424" y="367" font-size="13.5" text-anchor="middle">Files under /inbox, /data …</text>
<path d="M546 362H566" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="336" width="350" height="52" rx="8" fill="#e7f5f1" stroke="#0b6d70"/>
<text x="745" y="367" font-size="12.5" text-anchor="middle" font-family="Menlo,monospace" fill="#0b6d70">many() from 'env:classifier'</text>
<path d="M924 362H940" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="944" y="336" width="196" height="52" rx="8" fill="#fff" stroke="#142a42" stroke-width="1.5"/>
<text x="1042" y="367" font-size="13" text-anchor="middle">what the script returns</text>
<rect x="40" y="422" width="1120" height="88" rx="12" fill="#fff" stroke="#cad9e6"/>
<text x="64" y="460" font-size="19">Browser</text>
<text x="64" y="486" font-size="12" font-family="Menlo,monospace" fill="#65788a">withClassifier(adapter)</text>
<rect x="306" y="440" width="236" height="52" rx="8" fill="#f4f7fa" stroke="#cad9e6"/>
<text x="424" y="471" font-size="13.5" text-anchor="middle">The live page (DOM / a11y tree)</text>
<path d="M546 466H566" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="440" width="350" height="52" rx="8" fill="#e7f5f1" stroke="#0b6d70"/>
<text x="745" y="471" font-size="12.5" text-anchor="middle" font-family="Menlo,monospace" fill="#0b6d70">browser.judge({ sessionId, questions })</text>
<path d="M924 466H940" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="944" y="440" width="196" height="52" rx="8" fill="#fff" stroke="#142a42" stroke-width="1.5"/>
<text x="1042" y="471" font-size="13" text-anchor="middle">answers — never the page</text>
<rect x="40" y="526" width="1120" height="88" rx="12" fill="#fff" stroke="#cad9e6"/>
<text x="64" y="564" font-size="19">Foundry</text>
<text x="64" y="590" font-size="12" font-family="Menlo,monospace" fill="#65788a">glove-classifier/foundry</text>
<rect x="306" y="544" width="236" height="52" rx="8" fill="#f4f7fa" stroke="#cad9e6"/>
<text x="424" y="575" font-size="13.5" text-anchor="middle">An inbound transmission event</text>
<path d="M546 570H566" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="544" width="350" height="52" rx="8" fill="#e7f5f1" stroke="#0b6d70"/>
<text x="745" y="575" font-size="12.5" text-anchor="middle" font-family="Menlo,monospace" fill="#0b6d70">classifyInbound · classifierPredicate</text>
<path d="M924 570H940" stroke="#0b6d70" stroke-width="2" marker-end="url(#a)"/>
<rect x="944" y="544" width="196" height="52" rx="8" fill="#fff" stroke="#142a42" stroke-width="1.5"/>
<text x="1042" y="575" font-size="13" text-anchor="middle">event kind · playbook match</text>
